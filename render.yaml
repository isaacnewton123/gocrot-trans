services:
  - type: web
    name: gocrot-wa-bot
    runtime: node
    plan: free
    region: singapore
    rootDir: bot
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: PUBLIC_VALIDATE_URL
        value: https://gocrot-trans.vercel.app/validasi
